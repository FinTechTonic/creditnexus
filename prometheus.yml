# Prometheus configuration for CreditNexus
global:
  scrape_interval: 15s  # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'creditnexus'
    environment: 'development'

# Scrape configurations
scrape_configs:
  # Scrape CreditNexus API metrics
  - job_name: 'creditnexus-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']  # Access host machine from Docker
        labels:
          service: 'creditnexus-api'
          instance: 'localhost:8000'
